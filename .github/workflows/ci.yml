name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl netcat-openbsd apache2-utils

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make integration

      - name: Shutdown tests
        run: make shutdown-test

      - name: Sanitizers
        run: make sanitize

      - name: Restore normal build
        run: make clean && make

      - name: Load test
        run: make load
